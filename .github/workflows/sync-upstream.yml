name: Sync with upstream

# Merges myjian/mai-tools into this fork every day, so new song data and
# fixes arrive without anyone remembering to pull, and regenerates
# public/data/fork/missing-songs-auto.json for charts upstream lacks. The maimaiscrape scraper
# loads this fork's scripts, and a stale song database crashes the rating
# calculator on new charts.
#
# A merge conflict fails the job (GitHub emails the repo owner) and pushes
# nothing; resolve it by hand and push, and the next run carries on.
#
# A push made with GITHUB_TOKEN doesn't trigger other workflows, so the
# "Build with webpack and deploy" workflow won't run for the merge. This
# workflow builds and deploys it itself, only when something changed.
# Kept in its own file so upstream changes to webpack.yml never conflict.

on:
  schedule:
    - cron: '17 19 * * *' # 03:17 Malaysia time, well clear of the 22:45 scrape
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.push.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Merge upstream/gh-pages
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/myjian/mai-tools.git
          git fetch upstream gh-pages
          if git merge-base --is-ancestor upstream/gh-pages HEAD; then
            echo 'Already up to date with upstream.'
          else
            git merge --no-edit upstream/gh-pages
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # Charts arcade-songs has but upstream's song data doesn't yet. Allowed
      # to fail (arcade-songs down, say) without holding back the merge.
      - name: Regenerate missing-songs-auto.json
        continue-on-error: true
        run: |
          node scripts/fork/generate-missing-songs.mjs
          if ! git diff --quiet -- public/data/fork/; then
            git add public/data/fork/
            git commit -m 'Update missing-songs-auto.json from arcade-songs'
          fi

      - name: Push
        id: push
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/gh-pages)" ]; then
            echo 'Nothing new.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git push origin HEAD:gh-pages
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # Built here rather than through webpack-build.yml: that one checks out
      # the commit that triggered the run, which is from before the merge.
      - name: Build
        if: steps.push.outputs.changed == 'true'
        run: |
          npm install
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.push.outputs.changed == 'true'
        with:
          path: build/

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
